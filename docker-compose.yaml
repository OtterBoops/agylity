# ==============================================================================
# agylity - Docker Compose Production Deployment
# Container-native deployment on homelab, VPS, or local docker
# ==============================================================================

services:
  agylity:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/otterboops/agylity:latest
    container_name: agylity
    restart: unless-stopped

    ports:
      - '3000:3000'

    volumes:
      # Persistent Data Directory (SQLite store and sentry state)
      - ./data:/app/data
      # Target repositories mounted in container at /repos/<id>
      # - /path/to/my-repo:/repos/my-repo
      # Mount host Antigravity CLI & OAuth tokens
      # - /usr/local/bin/agy:/usr/local/bin/agy:ro
      - ~/.gemini:/home/node/.gemini
      - ~/.config/antigravity:/home/node/.config/antigravity:ro
      # Mount git identity
      - ~/.gitconfig:/home/node/.gitconfig:ro

    environment:
      - WEB_UI_ENABLED=true

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
