# ==============================================================================
# agylity - Docker Compose Production Deployment
# Container-native deployment for Homelab, VPS, or local Docker
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Control Plane: Quota Sentry, Alerting Engine & Swarm Coordinator
  # ----------------------------------------------------------------------------
  agylity:
    build:
      context: .
      dockerfile: Dockerfile
      target: coordinator
    image: ghcr.io/otterboops/agylity:latest
    container_name: agylity
    restart: unless-stopped

    ports:
      - '8484:8484'

    volumes:
      - agylity-data:/app/data
      - agylity-gemini:/home/node/.gemini

    environment:
      - NODE_ENV=production
      - WEB_UI_ENABLED=true
      - WEB_UI_PORT=8484
      - WEB_UI_HOST=0.0.0.0
      # Required: the control plane refuses to start on a non-loopback host without a token.
      - WEB_UI_AUTH_TOKEN=${WEB_UI_AUTH_TOKEN}
      - COORDINATOR_ENABLED=true
      - NOTIFICATION_CHANNELS=discord,webhook
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_NOTIFICATION_CHANNEL_ID=${DISCORD_NOTIFICATION_CHANNEL_ID}
      - DISCORD_OWNER_USER_ID=${DISCORD_OWNER_USER_ID}
      - DISCORD_PING_OWNER=${DISCORD_PING_OWNER:-true}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}

    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8484/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ----------------------------------------------------------------------------
  # Ephemeral Swarm Runner: Headless Task Execution Runtime
  # ----------------------------------------------------------------------------
  agylity-runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ghcr.io/otterboops/agylity-runner:latest
    container_name: agylity-runner
    restart: unless-stopped

    # Shared Docker named volume for Antigravity CLI credentials:
    # Authenticate once via: docker exec -it agylity agy
    volumes:
      - agylity-gemini:/home/node/.gemini
      - agylity-runner-data:/data
      # Optional: Uncomment if you want to cache git clones between tasks instead of cloning fresh.
      # - runner-repos:/repos

    environment:
      - NODE_ENV=production
      - COORDINATOR_URL=http://agylity:8484
      - RUNNER_STATE_PATH=/data/runner.json
      - RUNNER_NAME=agylity-runner-1
      - RUNNER_TOKEN=${RUNNER_TOKEN}
      # Git identity & GitHub token for zero-mount authenticated git clone/push
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GIT_AUTHOR_NAME=agylity[bot]
      - GIT_AUTHOR_EMAIL=agylity@users.noreply.github.com
      - GIT_COMMITTER_NAME=agylity[bot]
      - GIT_COMMITTER_EMAIL=agylity@users.noreply.github.com

    depends_on:
      agylity:
        condition: service_healthy

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  # High-performance Docker-managed volume for SQLite database (agylity.db) & alert state
  agylity-data:
  # Shared credential volume for agy CLI across coordinator and runner
  agylity-gemini:
  # Persistent volume for runner registration token & runner.json state
  agylity-runner-data:
  # Optional cache volume for git repos across runner task executions
  # runner-repos:
