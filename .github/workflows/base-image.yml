name: Base Image (agylity-base)

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker/entrypoint.sh
      - .github/workflows/base-image.yml
  schedule:
    # Weekly refresh picks up upstream node:26-slim and agy CLI updates.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    name: Build & Push Base Image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Lowercase Base Image Tag
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "BASE_TAG=ghcr.io/${repo}-base:latest" >> "$GITHUB_ENV"

      - name: Build and Push Base Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          push: true
          provenance: false
          sbom: false
          outputs: type=image,push=true,compression=zstd,oci-mediatypes=true
          tags: ${{ env.BASE_TAG }}
          cache-from: type=gha,scope=agylity-base
          cache-to: type=gha,mode=max,scope=agylity-base
