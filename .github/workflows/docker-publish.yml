name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  RUNNER_IMAGE: ghcr.io/${{ github.repository }}-runner

jobs:
  test:
    name: Typecheck & Test (Node 26)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js 26
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Root & Client Dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev

      - name: Lint & Tailwind Canonicalization Check
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Build Bundles
        run: npm run build

      - name: Run Full Deterministic Test Suite
        run: npm test

      # The container build consumes this bundle instead of recompiling in CI.
      - name: Upload Compiled Bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  verify-docker:
    name: Verify Docker Build (Dry Run)
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Compiled Bundle
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .dist-ctx/app/dist

      # Both targets build in one bake session, so the shared stages resolve once.
      # The context lives inside the workspace: buildx refuses to read a named
      # context from outside it without an explicit --allow=fs.read entitlement.
      - name: Bake Both Images (No Push)
        env:
          DIST_CONTEXT: .dist-ctx
        run: |
          docker buildx bake -f docker-bake.hcl \
            --set '*.output=type=cacheonly' \
            --provenance=false --sbom=false

  publish:
    name: Build & Publish Container Images (GHCR)
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag matrix mirrors the metadata-action config this replaced: main/edge on
      # branch pushes, semver + latest on tags, and a sha tag on both.
      - name: Resolve Image Tags
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          coord=("${IMAGE}:sha-${short}")
          runner=("${RUNNER_IMAGE}:sha-${short}")
          version=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            candidate="${GITHUB_REF_NAME#v}"
            if [[ "$candidate" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              version="$candidate"
            fi
          else
            coord+=("${IMAGE}:main" "${IMAGE}:edge")
            runner+=("${RUNNER_IMAGE}:main" "${RUNNER_IMAGE}:edge")
          fi
          if [[ -n "$version" ]]; then
            minor="${version%%-*}"
            minor="${minor%.*}"
            coord+=("${IMAGE}:${version}" "${IMAGE}:${minor}")
            runner+=("${RUNNER_IMAGE}:${version}" "${RUNNER_IMAGE}:${minor}")
            if [[ ! "$GITHUB_REF_NAME" =~ -(beta|rc|alpha) ]]; then
              coord+=("${IMAGE}:latest")
              runner+=("${RUNNER_IMAGE}:latest")
            fi
          fi
          {
            echo "COORDINATOR_TAGS=$(IFS=,; echo "${coord[*]}")"
            echo "RUNNER_TAGS=$(IFS=,; echo "${runner[*]}")"
            echo "VERSION=${version}"
            echo "REVISION=${GITHUB_SHA}"
            echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      # A tag on a commit whose images were already pushed by the branch run only
      # needs retagging; rebuilding identical layers is wasted time.
      - name: Check for a Reusable sha Image
        id: reuse
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/* ]] \
            && docker buildx imagetools inspect "${IMAGE}:sha-${short}" >/dev/null 2>&1 \
            && docker buildx imagetools inspect "${RUNNER_IMAGE}:sha-${short}" >/dev/null 2>&1; then
            echo "reusable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reusable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retag Coordinator From sha Image
        if: steps.reuse.outputs.reusable == 'true'
        run: |
          set -euo pipefail
          source="${IMAGE}:sha-${GITHUB_SHA::7}"
          args=()
          IFS=',' read -ra tags <<< "$COORDINATOR_TAGS"
          for tag in "${tags[@]}"; do
            [[ "$tag" == "$source" ]] || args+=(--tag "$tag")
          done
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "No additional tags resolved; nothing to retag."
            exit 0
          fi
          docker buildx imagetools create "${args[@]}" "$source"

      - name: Retag Runner From sha Image
        if: steps.reuse.outputs.reusable == 'true'
        run: |
          set -euo pipefail
          source="${RUNNER_IMAGE}:sha-${GITHUB_SHA::7}"
          args=()
          IFS=',' read -ra tags <<< "$RUNNER_TAGS"
          for tag in "${tags[@]}"; do
            [[ "$tag" == "$source" ]] || args+=(--tag "$tag")
          done
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "No additional tags resolved; nothing to retag."
            exit 0
          fi
          docker buildx imagetools create "${args[@]}" "$source"

      - name: Download Compiled Bundle
        if: steps.reuse.outputs.reusable != 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .dist-ctx/app/dist

      - name: Bake and Push Both Images
        if: steps.reuse.outputs.reusable != 'true'
        env:
          DIST_CONTEXT: .dist-ctx
          PUSH: 'true'
        run: docker buildx bake -f docker-bake.hcl --provenance=false --sbom=false

      # The annotated tag message (or commit subject) becomes the ### <slug> at the top of the release body.
      - name: Resolve Release Slug
        if: startsWith(github.ref, 'refs/tags/')
        id: release_slug
        run: |
          TAG="${{ github.ref_name }}"
          git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}" || true
          if [ "$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null)" = "tag" ]; then
            RAW_TITLE=$(git for-each-ref "refs/tags/${TAG}" --format='%(contents:subject)')
          else
            RAW_TITLE=$(git log -1 --format=%s "refs/tags/${TAG}" 2>/dev/null || echo "")
          fi
          SLUG=$(printf '%s' "$RAW_TITLE" | sed -E 's/^v?[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*(—|:|-)[[:space:]]*//')
          if [ -n "$SLUG" ] && [ "$SLUG" != "$TAG" ]; then
            echo "body=### ${SLUG}" >> "$GITHUB_OUTPUT"
          else
            echo "body=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.release_slug.outputs.body }}
          generate_release_notes: true
