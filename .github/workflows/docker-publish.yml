name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'skills/**'
      - '.agents/**'
    tags:
      - 'v*.*.*'
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'skills/**'
      - '.agents/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  RUNNER_IMAGE: ghcr.io/${{ github.repository }}-runner

jobs:
  bundle:
    name: Build Bundles (Node 26)
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js 26
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Root & Client Dependencies
        run: |
          npm ci --no-audit --no-fund &
          p1=$!
          npm --prefix frontend ci --no-audit --no-fund &
          p2=$!
          wait "$p1" && wait "$p2"

      - name: Build Bundles
        run: npm run build

      - name: Upload Compiled Bundle
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  verify:
    name: Lint, Typecheck & Test (Node 26)
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js 26
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Root & Client Dependencies
        run: |
          npm ci --no-audit --no-fund &
          p1=$!
          npm --prefix frontend ci --no-audit --no-fund &
          p2=$!
          wait "$p1" && wait "$p2"

      - name: Audit Production Dependencies
        if: github.event_name == 'pull_request'
        run: npm audit --omit=dev

      - name: Lint & Tailwind Canonicalization Check
        run: |
          npx prettier --check . &
          p1=$!
          npx eslint frontend/src &
          p2=$!
          wait "$p1" && wait "$p2"

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Build Client Bundle for Web UI Tests
        run: npm run build:client

      - name: Run Full Deterministic Test Suite
        run: npm test

  verify-docker:
    name: Verify Docker Build (Dry Run)
    needs: bundle
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download Compiled Bundle
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: .dist-ctx/app/dist

      - name: Bake Coordinator (Dry Run)
        env:
          DIST_CONTEXT: .dist-ctx
        run: |
          docker buildx bake -f docker-bake.hcl coordinator \
            --set '*.output=type=cacheonly' \
            --provenance=false --sbom=false

  publish:
    name: Build & Publish Container Images (GHCR)
    needs: [bundle, verify]
    # A failed verification must never publish an image; tag runs skip `verify`, so only a
    # non-skipped verify has to pass.
    if: >-
      always() &&
      (needs.bundle.result == 'success' || (startsWith(github.ref, 'refs/tags/') && needs.bundle.result == 'skipped')) &&
      (needs.verify.result == 'success' || (startsWith(github.ref, 'refs/tags/') && needs.verify.result == 'skipped')) &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branch pushes publish only :sha-<short> here; `promote` tags :main/:edge after `verify` passes.
      - name: Resolve Image Tags & Base Image
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          RUNNER_IMAGE="${RUNNER_IMAGE,,}"
          repo="${GITHUB_REPOSITORY,,}"
          short="${GITHUB_SHA::7}"
          coord=("${IMAGE}:sha-${short}")
          runner=("${RUNNER_IMAGE}:sha-${short}")
          version=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            candidate="${GITHUB_REF_NAME#v}"
            if [[ "$candidate" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              version="$candidate"
            fi
          fi
          if [[ -n "$version" ]]; then
            minor="${version%%-*}"
            minor="${minor%.*}"
            coord+=("${IMAGE}:${version}" "${IMAGE}:${minor}")
            runner+=("${RUNNER_IMAGE}:${version}" "${RUNNER_IMAGE}:${minor}")
            if [[ ! "$GITHUB_REF_NAME" =~ -(beta|rc|alpha) ]]; then
              coord+=("${IMAGE}:latest")
              runner+=("${RUNNER_IMAGE}:latest")
            fi
          fi
          base_ref="ghcr.io/${repo}-base:latest"
          if docker buildx imagetools inspect "$base_ref" >/dev/null 2>&1; then
            base_image="$base_ref"
          else
            base_image="base"
          fi
          {
            echo "IMAGE=${IMAGE}"
            echo "RUNNER_IMAGE=${RUNNER_IMAGE}"
            echo "BASE_IMAGE=${base_image}"
            echo "COORDINATOR_TAGS=$(IFS=,; echo "${coord[*]}")"
            echo "RUNNER_TAGS=$(IFS=,; echo "${runner[*]}")"
            echo "VERSION=${version}"
            echo "REVISION=${GITHUB_SHA}"
            echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      # A tag on a commit whose images were already pushed by the branch run only
      # needs retagging; rebuilding identical layers is wasted time.
      - name: Check for a Reusable sha Image
        id: reuse
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/* ]] \
            && docker buildx imagetools inspect "${IMAGE}:sha-${short}" >/dev/null 2>&1 \
            && docker buildx imagetools inspect "${RUNNER_IMAGE}:sha-${short}" >/dev/null 2>&1; then
            echo "reusable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reusable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retag Coordinator From sha Image
        if: steps.reuse.outputs.reusable == 'true'
        run: |
          set -euo pipefail
          source="${IMAGE}:sha-${GITHUB_SHA::7}"
          IFS=',' read -ra tags <<< "$COORDINATOR_TAGS"
          args=()
          for t in "${tags[@]}"; do
            [[ "$t" == "$source" ]] || args+=(--tag "$t")
          done
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "No additional tags resolved; nothing to retag."
            exit 0
          fi
          docker buildx imagetools create "${args[@]}" "$source"

      - name: Retag Runner From sha Image
        if: steps.reuse.outputs.reusable == 'true'
        run: |
          set -euo pipefail
          source="${RUNNER_IMAGE}:sha-${GITHUB_SHA::7}"
          IFS=',' read -ra tags <<< "$RUNNER_TAGS"
          args=()
          for t in "${tags[@]}"; do
            [[ "$t" == "$source" ]] || args+=(--tag "$t")
          done
          if [[ ${#args[@]} -eq 0 ]]; then
            echo "No additional tags resolved; nothing to retag."
            exit 0
          fi
          docker buildx imagetools create "${args[@]}" "$source"

      - name: Download Compiled Bundle
        if: steps.reuse.outputs.reusable != 'true' && needs.bundle.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: .dist-ctx/app/dist

      - name: Bake and Push Both Images
        if: steps.reuse.outputs.reusable != 'true'
        env:
          DIST_CONTEXT: ${{ needs.bundle.result == 'success' && '.dist-ctx' || '' }}
          PUSH: 'true'
        run: docker buildx bake -f docker-bake.hcl --provenance=false --sbom=false

      # The annotated tag message (or commit subject) becomes the ### <slug> at the top of the release body.
      - name: Resolve Release Slug
        if: startsWith(github.ref, 'refs/tags/')
        id: release_slug
        run: |
          TAG="${{ github.ref_name }}"
          git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}" || true
          if [ "$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null)" = "tag" ]; then
            RAW_TITLE=$(git for-each-ref "refs/tags/${TAG}" --format='%(contents:subject)')
          else
            RAW_TITLE=$(git log -1 --format=%s "refs/tags/${TAG}" 2>/dev/null || echo "")
          fi
          SLUG=$(printf '%s' "$RAW_TITLE" | sed -E 's/^v?[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*(—|:|-)[[:space:]]*//')
          if [ -n "$SLUG" ] && [ "$SLUG" != "$TAG" ]; then
            echo "body=### ${SLUG}" >> "$GITHUB_OUTPUT"
          else
            echo "body=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.release_slug.outputs.body }}
          generate_release_notes: true

  promote:
    name: Promote Main & Edge Tags (GHCR)
    needs: [verify, publish]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote sha Image to main and edge
        run: |
          set -euo pipefail
          IMAGE="${IMAGE,,}"
          RUNNER_IMAGE="${RUNNER_IMAGE,,}"
          short="${GITHUB_SHA::7}"
          docker buildx imagetools create --tag "${IMAGE}:main" --tag "${IMAGE}:edge" "${IMAGE}:sha-${short}"
          docker buildx imagetools create --tag "${RUNNER_IMAGE}:main" --tag "${RUNNER_IMAGE}:edge" "${RUNNER_IMAGE}:sha-${short}"
